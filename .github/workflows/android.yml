name: Android quality and test APK
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Materialize SHA-256 pinned Quran text and font
        run: python3 tools/prepare_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Source, licensing, locale, Quran and privacy gates
        run: python3 tools/verify_foundation.py
      - name: Tests, lint, dependency inventory and Debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:dependencyInventory --no-daemon --stacktrace
      - name: Check APK permissions, signature and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk > app/build/permissions.txt
          python3 tools/check_apk.py app/build/outputs/apk/debug/app-debug.apk app/build/permissions.txt
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS
      - name: Upload test-only APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/dependency-inventory.tsv
            app/build/permissions.txt
          if-no-files-found: error
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: ignore
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Materialize SHA-256 pinned Quran text and font
        run: python3 tools/prepare_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb pull /sdcard/Android/data/org.erthi.noor/files/screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-API-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            screenshots/
          if-no-files-found: ignore
